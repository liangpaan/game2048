[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game2048"]

[project]
name = "game2048"
version = "0.0.5"
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "pygame",
    "numpy",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ppo = ["sb3-contrib>=2.6,<3", "torch>=2.3,<3"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
game2048-play = "game2048.play:main"
